<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品登録（確認）</title>

  <!-- Bootstrap 5 (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-header bg-white">
          <h1 class="h4 mb-0">商品登録（確認）</h1>
          <p class="text-muted small mb-0">内容を確認して「登録」を押してください。</p>
        </div>

        <div class="card-body">

          <!-- 表示（確認用） -->
          <dl class="row mb-0">
            <dt class="col-4 text-muted">商品名</dt>
            <dd class="col-8" th:text="${productRegisterViewModel.name}">商品名</dd>

            <dt class="col-4 text-muted">単価</dt>
            <dd class="col-8">
              <span th:text="${#numbers.formatInteger(productRegisterViewModel.price, 0, 'COMMA')}">0</span>
              <span class="text-muted">円</span>
            </dd>

            <dt class="col-4 text-muted">カテゴリ</dt>
            <dd class="col-8">
              <span th:text="${productRegisterViewModel.categoryName}">カテゴリ名</span>
              <span class="text-muted small">
                （ID: <span th:text="${productRegisterViewModel.categoryId}">0</span>）
              </span>
            </dd>

            <dt class="col-4 text-muted">初期在庫</dt>
            <dd class="col-8">
              <span th:text="${productRegisterViewModel.initialStock}">0</span>
            </dd>
          </dl>

        </div>

        <div class="card-footer bg-white">
          <div class="d-grid gap-2">

            <!-- 登録（PRG：POST -> redirect） -->
            <form th:action="@{/products/register}" method="post">
              <button type="submit" class="btn btn-primary w-100">
                登録
              </button>
            </form>

            <!-- 戻る：入力画面へ -->
            <a th:href="@{/products/new}" class="btn btn-outline-secondary">
              戻る
            </a>

          </div>
        </div>
      </div>

      <p class="text-muted small mt-3 mb-0">
        ※ 「登録」を押すと、登録処理後に完了画面へ遷移します。
      </p>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
