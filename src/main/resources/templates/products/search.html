<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品検索</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-4">

  <div class="row justify-content-center">
    <div class="col-12 col-lg-10">

      <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h4 mb-0">商品検索</h1>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/products/new}">商品登録へ</a>
      </div>

      <div class="card shadow-sm mb-3">
        <div class="card-body">

          <!-- 検索フォーム：GET -->
          <form th:action="@{/products/search}" method="get" class="row g-2 align-items-center">
            <div class="col-12 col-md-8">
              <label for="keyword" class="form-label mb-1">キーワード（商品名）</label>
              <input id="keyword"
                     name="keyword"
                     type="text"
                     class="form-control"
                     th:value="${keyword}"
                     placeholder="例：ボールペン / マウス">
            </div>

            <div class="col-12 col-md-4 d-grid">
              <label class="form-label mb-1 d-none d-md-block">&nbsp;</label>
              <button type="submit" class="btn btn-primary">検索</button>
            </div>
          </form>

          <div class="mt-3 d-flex justify-content-between align-items-center">
            <div class="text-muted small">
              <span th:if="${keyword != null and !#strings.isEmpty(keyword)}">
                「<span th:text="${keyword}">keyword</span>」の検索結果：
                <span class="fw-bold" th:text="${resultCount}">0</span> 件
              </span>
              <span th:if="${keyword == null or #strings.isEmpty(keyword)}">
                キーワードを入力して検索してください。
              </span>
            </div>

            <a class="btn btn-outline-secondary btn-sm" th:href="@{/products/search}">クリア</a>
          </div>

        </div>
      </div>

      <!-- 結果テーブル -->
      <div class="card shadow-sm">
        <div class="card-body p-0">

          <!-- 0件 -->
          <div class="p-4" th:if="${results == null or #lists.isEmpty(results)}">
            <div class="alert alert-light border mb-0">
              <div class="fw-bold">検索結果がありません</div>
              <div class="text-muted small">別のキーワードをお試しください。</div>
            </div>
          </div>

          <!-- 件数あり -->
          <div class="table-responsive" th:if="${results != null and !#lists.isEmpty(results)}">
            <table class="table table-hover mb-0 align-middle">
              <thead class="table-light">
                <tr>
                  <th style="width: 45%;">商品名</th>
                  <th style="width: 15%;">単価</th>
                  <th style="width: 25%;">カテゴリ</th>
                  <th style="width: 15%;">在庫</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="r : ${results}">
                  <td>
                    <div class="fw-semibold" th:text="${r.name()}">商品名</div>
                    <div class="text-muted small">ID: <span th:text="${r.productId()}">0</span></div>
                  </td>
                  <td>
                    <span th:text="${#numbers.formatInteger(r.price(), 0, 'COMMA')}">0</span> 円
                  </td>
                  <td th:text="${r.categoryName()}">カテゴリ</td>
                  <td>
                    <span class="badge text-bg-secondary" th:text="${r.stock()}">0</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>
      </div>

      <div class="mt-3">
        <a th:href="@{/}" class="btn btn-outline-secondary">メニューへ</a>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
