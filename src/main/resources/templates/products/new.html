<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品登録</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-header bg-white">
          <h1 class="h4 mb-0">商品登録</h1>
          <p class="text-muted small mb-0">必要事項を入力して「確認へ」を押してください。</p>
        </div>

        <div class="card-body">
          <form th:action="@{/products/confirm}"
                th:object="${productRegisterViewModel}"
                method="post"
                novalidate>

            <!-- 商品名 -->
            <div class="mb-3">
              <label class="form-label">商品名</label>
              <input type="text"
                     class="form-control"
                     th:field="*{name}"
                     th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                     placeholder="例：水性ボールペン(黒)">
              <div class="invalid-feedback" th:errors="*{name}">商品名エラー</div>
            </div>

            <!-- 単価 -->
            <div class="mb-3">
              <label class="form-label">単価</label>
              <div class="input-group">
                <span class="input-group-text">¥</span>
                <input type="number"
                       class="form-control"
                       th:field="*{price}"
                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                       placeholder="例：120"
                       min="0">
                <div class="invalid-feedback" th:errors="*{price}">単価エラー</div>
              </div>
            </div>

            <!-- カテゴリ -->
            <div class="mb-3">
              <label class="form-label">カテゴリ</label>
              <select class="form-select"
                      th:field="*{categoryId}"
                      th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid' : ''">
                <option value="">-- 選択 --</option>
                <!-- categories は Model or SessionAttributes から -->
                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${c.name}">
                </option>
              </select>
              <div class="invalid-feedback" th:errors="*{categoryId}">カテゴリエラー</div>
            </div>

            <!-- 初期在庫 -->
            <div class="mb-4">
              <label class="form-label">初期在庫</label>
              <input type="number"
                     class="form-control"
                     th:field="*{initialStock}"
                     th:classappend="${#fields.hasErrors('initialStock')} ? 'is-invalid' : ''"
                     placeholder="例：100"
                     min="0">
              <div class="invalid-feedback" th:errors="*{initialStock}">在庫エラー</div>
              <div class="form-text">0以上の数値を入力してください。</div>
            </div>

            <!-- ボタン -->
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">
                完了
              </button>
              <a th:href="@{/}" class="btn btn-outline-secondary">
                メニューへ
              </a>
            </div>

          </form>
        </div>
      </div>

      <p class="text-muted small mt-3 mb-0">
        ※ 入力チェックはサーバー側で実施します。
      </p>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
