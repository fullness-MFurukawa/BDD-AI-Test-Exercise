<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登録完了</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-body text-center py-5">
          <div class="display-6 mb-2">✅</div>
          <h1 class="h4 mb-3">登録が完了しました</h1>

          <p class="mb-4">
            登録した商品ID：
            <span class="fw-bold" th:text="${productId}">0</span>
          </p>

          <div class="d-grid gap-2">
            <a class="btn btn-primary" th:href="@{/products/new}">続けて登録する</a>
            <a class="btn btn-outline-secondary" th:href="@{/}">メニューへ</a>
          </div>
        </div>
      </div>

      <p class="text-muted small mt-3 mb-0">
        ※ 再読み込みしても二重登録されないよう、リダイレクトしています（PRG）。
      </p>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
