<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>セール価格設定</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <!-- 登録完了メッセージ -->
      <div class="alert alert-success" th:if="${completeMessage != null}"
           th:text="${completeMessage}">完了メッセージ</div>

      <div class="card shadow-sm">
        <div class="card-header bg-white">
          <h1 class="h4 mb-0">セール価格設定</h1>
          <p class="text-muted small mb-0">必要事項を入力して「登録」を押してください。</p>
        </div>

        <div class="card-body">
          <form th:action="@{/sales/register}"
                th:object="${saleRegisterViewModel}"
                method="post"
                novalidate>

            <!-- 対象商品 -->
            <div class="mb-3">
              <label class="form-label">対象商品</label>
              <select class="form-select"
                      th:field="*{productId}"
                      th:classappend="${#fields.hasErrors('productId')} ? 'is-invalid' : ''">
                <option value="">-- 選択 --</option>
                <option th:each="p : ${products}"
                        th:value="${p.id}"
                        th:text="${p.name + ' (単価 ' + p.price + '円)'}">
                </option>
              </select>
              <div class="invalid-feedback" th:errors="*{productId}">対象商品エラー</div>
            </div>

            <!-- セール価格 -->
            <div class="mb-3">
              <label class="form-label">セール価格</label>
              <div class="input-group">
                <span class="input-group-text">¥</span>
                <input type="text"
                       inputmode="numeric"
                       class="form-control"
                       th:field="*{salePrice}"
                       th:classappend="${#fields.hasErrors('salePrice')} ? 'is-invalid' : ''"
                       placeholder="例：100">
                <div class="invalid-feedback" th:errors="*{salePrice}">セール価格エラー</div>
              </div>
              <div class="form-text">0より大きく、対象商品の単価より低い値を入力してください。</div>
            </div>

            <!-- 開始日 -->
            <div class="mb-3">
              <label class="form-label">開始日</label>
              <input type="date"
                     class="form-control"
                     th:field="*{startDate}"
                     th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid' : ''">
              <div class="invalid-feedback" th:errors="*{startDate}">開始日エラー</div>
            </div>

            <!-- 終了日 -->
            <div class="mb-4">
              <label class="form-label">終了日</label>
              <input type="date"
                     class="form-control"
                     th:field="*{endDate}"
                     th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid' : ''">
              <div class="invalid-feedback" th:errors="*{endDate}">終了日エラー</div>
            </div>

            <!-- ボタン -->
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">
                登録
              </button>
              <a th:href="@{/sales/list}" class="btn btn-outline-secondary">
                セール一覧へ
              </a>
              <a th:href="@{/}" class="btn btn-outline-secondary">
                メニューへ
              </a>
            </div>

          </form>
        </div>
      </div>

      <p class="text-muted small mt-3 mb-0">
        ※ 入力チェックはサーバー側で実施します。
      </p>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
