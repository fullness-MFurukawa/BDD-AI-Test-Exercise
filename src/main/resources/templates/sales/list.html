<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>セール一覧</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-10">

      <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h4 mb-0">セール一覧</h1>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/sales/new}">セール価格設定へ</a>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-0">

          <!-- 0件 -->
          <div class="p-4" th:if="${sales == null or #lists.isEmpty(sales)}">
            <div class="alert alert-light border mb-0">
              <div class="fw-bold">登録されているセールはありません</div>
            </div>
          </div>

          <!-- 件数あり -->
          <div class="table-responsive" th:if="${sales != null and !#lists.isEmpty(sales)}">
            <table class="table table-hover mb-0 align-middle">
              <thead class="table-light">
                <tr>
                  <th style="width: 35%;">商品名</th>
                  <th style="width: 15%;">単価</th>
                  <th style="width: 15%;">セール価格</th>
                  <th style="width: 35%;">セール期間</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="s : ${sales}">
                  <td class="fw-semibold" th:text="${s.productName()}">商品名</td>
                  <td>
                    <span th:text="${#numbers.formatInteger(s.price(), 0, 'COMMA')}">0</span> 円
                  </td>
                  <td class="text-danger fw-bold">
                    <span th:text="${#numbers.formatInteger(s.salePrice(), 0, 'COMMA')}">0</span> 円
                  </td>
                  <td>
                    <span th:text="${#temporals.format(s.startDate(), 'yyyy/MM/dd')}">開始</span>
                    〜
                    <span th:text="${#temporals.format(s.endDate(), 'yyyy/MM/dd')}">終了</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>
      </div>

      <div class="mt-3">
        <a th:href="@{/}" class="btn btn-outline-secondary">メニューへ</a>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
