<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>メニュー</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-header bg-white">
          <h1 class="h4 mb-0">メニュー</h1>
          <p class="text-muted small mb-0">機能を選択してください。</p>
        </div>

        <div class="card-body">
          <div class="list-group">
            <a th:href="@{/products/new}" class="list-group-item list-group-item-action">
              商品登録
            </a>
            <a th:href="@{/products/search}" class="list-group-item list-group-item-action">
              商品検索
            </a>
          </div>
        </div>
      </div>

      <p class="text-muted small mt-3 mb-0">
        ※ 演習用アプリ
      </p>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
